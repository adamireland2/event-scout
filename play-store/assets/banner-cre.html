<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Feature graphic — Event Scout CRE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1024px;height:500px;overflow:hidden;font-family:'Inter',system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#312e81 0%,#4f46e5 45%,#7c3aed 100%);display:flex;align-items:center;padding:0 70px;color:#fff;position:relative}
.glow{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.35),transparent 70%);top:-200px;right:-100px}
.left{flex:1;position:relative;z-index:1}
.badge{display:inline-block;padding:8px 18px;border-radius:99px;background:rgba(255,255,255,.14);font-size:20px;font-weight:600;letter-spacing:.04em;margin-bottom:22px}
h1{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-bottom:16px}
p{font-size:26px;font-weight:500;color:#e0e7ff;line-height:1.4;max-width:560px}
.icon{width:230px;height:230px;border-radius:56px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:130px;box-shadow:0 30px 80px rgba(0,0,0,.3);position:relative;z-index:1}
</style>
</head>
<body>
<div class="glow"></div>
<div class="left">
  <div class="badge">🏙️ COMMERCIAL EDITION</div>
  <h1>Event Scout CRE</h1>
  <p>Find the commercial real estate events where your next clients will be.</p>
</div>
<div class="icon">🎯</div>
</body>
</html>
